async function sha256(value){
  const data=new TextEncoder().encode(value);
  const digest=await crypto.subtle.digest('SHA-256',data);
  return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

<p style="color:#9da7b3;margin:0 0 16px">Investičný komentár k novinkám. Nie je to aktualizácia cien, počtu kusov ani valuácií; bez nového XTB výpisu zostávajú existujúce hodnoty nedotknuté.</p>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">

</div>

</section>`;
    const review20261122="<section id=\"g2-review-20261122\" style=\"max-width:1180px;margin:24px auto;padding:24px;border:1px solid #5da9ff;border-radius:18px;background:#171a21;color:#f3f5f7;font-family:Inter,system-ui,sans-serif\">\n<h2>Trhy a plán Graham 2.0 · 22. 11. 2026</h2>\n<p>Najnovší snapshot XTB z 21. 11. o 00:59. Hodnoty v tejto sekcii sú aktuálne k tomuto screenshotu. Staršie sekcie nižšie obsahujú svoje historické údaje.</p>\n<p><strong>Účet 15 785,02 € · Hotovosť 200,78 € · Otvorený zisk +1 986,16 €</strong></p>\n<label>Postup k cieľu 300 000 € · 5,26 % <progress value=\"15785.02\" max=\"300000\" style=\"width:100%\"></progress></label>\n<h3>Čo sa deje</h3>\n<p>Piatkový výpredaj zasiahol technológie aj širší trh. S&amp;P 500 −3,70 %, Nasdaq −5,28 %, STOXX 600 približne −2 %. Reuters informoval o preverovaní účtovníctva Nvidie zo strany SEC. Rozsah preverovania zostáva nejasný. Trh zároveň prehodnocuje ocenenia a financovanie AI investícií.</p>\n<p>Fed 28. 10. ponechal sadzby na 3,75–4 %. Ďalšie zvýšenie je očakávanie, jeho uskutočnenie ešte nebolo oznámené. Silný rast vykázaných tržieb Nvidie a Microsoftu sa spája s obavami o budúcu návratnosť investícií a cashflow.</p>\n<h3>Portfólio podľa screenshotu</h3>\n<table style=\"width:100%;border-collapse:collapse\"><thead><tr><th align=\"left\">Pozícia</th><th align=\"right\">Hodnota EUR</th><th align=\"right\">Váha účtu</th></tr></thead><tbody><tr><td style=\"padding:7px\">Vanguard dividendové ETF</td><td align=\"right\">6 444,32</td><td align=\"right\">40.8 %</td></tr><tr><td style=\"padding:7px\">SPDR Dividend Aristocrats</td><td align=\"right\">2 471,92</td><td align=\"right\">15.7 %</td></tr><tr><td style=\"padding:7px\">Microsoft</td><td align=\"right\">1 555,25</td><td align=\"right\">9.9 %</td></tr><tr><td style=\"padding:7px\">Sanofi</td><td align=\"right\">1 280,01</td><td align=\"right\">8.1 %</td></tr><tr><td style=\"padding:7px\">Analog Devices</td><td align=\"right\">793,84</td><td align=\"right\">5.0 %</td></tr><tr><td style=\"padding:7px\">Applied Industrial Technologies</td><td align=\"right\">660,65</td><td align=\"right\">4.2 %</td></tr><tr><td style=\"padding:7px\">Realty Income</td><td align=\"right\">588,49</td><td align=\"right\">3.7 %</td></tr><tr><td style=\"padding:7px\">Waste Management</td><td align=\"right\">466,22</td><td align=\"right\">3.0 %</td></tr><tr><td style=\"padding:7px\">Endesa</td><td align=\"right\">407,26</td><td align=\"right\">2.6 %</td></tr><tr><td style=\"padding:7px\">Ageas</td><td align=\"right\">389,07</td><td align=\"right\">2.5 %</td></tr><tr><td style=\"padding:7px\">Nordea</td><td align=\"right\">351,93</td><td align=\"right\">2.2 %</td></tr><tr><td style=\"padding:7px\">Visa</td><td align=\"right\">175,28</td><td align=\"right\">1.1 %</td></tr></tbody></table>\n<p>Ranný snapshot 20. 11. → posledný snapshot · −365,35 € / −2,26 %. Hotovosť aj počty kusov rovnaké. Porovnávanie so staršími obdobiami vyžaduje úpravu o vklady, obchody a dividendy.</p>\n<h3>Rozhodnutie</h3><p><strong>Portfólio HOLD · Vanguard jadro vhodné na postupný nákup.</strong> Plán 200 € do existujúceho reálneho Vanguard ETF zostáva podmienený pokrytou rodinnou rezervou a financovaním Podhradovej. Ide o 1,27 % účtu. Po nákupe by jeho váha bola približne 42,1 % pri rovnakých cenách. Pripomienka na 23. 11. je nastavená.</p>\n<p>Vanguard k 31. 10. uvádzal 2 432 akcií, P/E 15,4, financie 28,7 %, technológie 5,6 %, USA 40,5 %, ročné priebežné náklady 0,29 %. Ide o historické ukazovatele. Aktuálna Margin of Safety nebola vyčíslená. ETF a jednotlivé akcie prinášajú aj cyklické a menové riziká.</p>\n<h3>Checklist rozhodnutia</h3>\n<label><input type=\"checkbox\"> Rodinná rezerva a Podhradová pokryté</label><br><label><input type=\"checkbox\"> Zhodný ticker a ISIN, reálne ETF, EUR kotácia</label><br><label><input type=\"checkbox\"> Cena, spread a stav trhu skontrolované pred nákupom</label><br><label><input type=\"checkbox\"> Po nákupe zapísať skutočnú cenu a počet kusov</label>\n<p>Pri jednotlivých firmách sledovať zmeny výhľadu ziskov, cashflow, dlhu a dividend. Samotný cenový pokles nepotvrdzuje poškodenie podnikania ani výhodné ocenenie. Ďalšie nákupy financovať z pravidelného investičného rozpočtu.</p>\n<p>Poplatky XTB do mesačného obratu 100 000 € bez obchodnej provízie, menová konverzia 0,5 %, plus spread a náklady fondu. Pri predaji overiť podmienky daňového oslobodenia a právny režim frakčných práv.</p>\n<details><summary>Zdroje a pojmy</summary><p>P/E vyjadruje cenu voči ročnému zisku. Cashflow je tok peňazí. Margin of Safety je rezerva medzi cenou a odhadovanou hodnotou.</p>\n<ul><li><a href=\"https://www.reuters.com/world/us-secs-nvidia-probe-is-examining-potential-accounting-issues-sources-say-2026-11-20/\">Reuters · SEC a Nvidia</a></li><li><a href=\"https://live.euronext.com/en/financial-news/tech-leads-global-stocks-rout-treasury-yields-fall\">Reuters · trhy 20. 11.</a></li><li><a href=\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a.htm\">Fed · 28. 10.</a></li><li><a href=\"https://fund-docs.vanguard.com/FTSE_All-World_High_Dividend_Yield_UCITS_ETF_USD_Accumulating_9677_EU_INT_UK_EN.pdf\">Vanguard · 31. 10.</a></li><li><a href=\"https://www.microsoft.com/en-us/investor/events/fy-2027/earnings-fy-2027-q1\">Microsoft · výsledky</a></li></ul></details></section>";
    const withRadar=enriched.includes('g2-market-radar-20261118')?enriched:enriched.replace(/<\/body>/i,marketRadar+'</body>');
    document.open();
    const withReview=withRadar.replace(/<body([^>]*)>/i, '<body$1>'+review20261122);
    document.write(withReview);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="login-card"><h1>Dashboard sa nepodarilo načítať</h1><div class="sub">'+err.message+'</div></div>';
  }
}

if(sessionStorage.getItem('g2_auth')==='ok') loadDashboard();

document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const input=document.getElementById('password').value;
  const hash=await sha256(input);
  if(hash===PASSWORD_HASH){
    sessionStorage.setItem('g2_auth','ok');
    loadDashboard();
  }else{
    document.getElementById('err').textContent='Nesprávne heslo.';
  }
});
</script>
